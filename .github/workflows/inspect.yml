name: inspect
on:
  push:
    branches: [master]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dump homepage publications
        run: |
          for f in _publications/*.md; do
            echo "=====BEGIN $f====="
            cat "$f"
            echo "=====END $f====="
          done
