name: inspect
on:
  push:
    branches: [master]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dump include and layout
        run: |
          for f in _includes/archive-single.html _layouts/single.html; do
            echo "=====BEGIN $f====="
            cat "$f"
            echo "=====END $f====="
          done
